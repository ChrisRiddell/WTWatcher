<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>WTWatcher | Network Monitor</title>

        <!-- External font connections -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@700&display=swap"
        />

        <!-- ES module dependencies -->
        <script type="importmap">
            {
                "imports": {
                    "chart.js/auto": "https://cdn.jsdelivr.net/npm/chart.js/auto/+esm",
                    "luxon": "https://cdn.jsdelivr.net/npm/luxon/+esm"
                }
            }
        </script>

        <link rel="stylesheet" href="styles.css" />
        <script type="module" src="scripts.js"></script>
    </head>

    <body>
        <div class="dashboard-container">
            <!-- Header -->
            <header>
                <div class="branding">
                    <h1>Network Monitor</h1>
                    <p>IT REALLY SLAPS THE ALPACA'S RUMP!</p>
                </div>

                <div class="controls">
                    <div class="control-group">
                        <label for="protocolFilter">Protocol</label>
                        <select id="protocolFilter">
                            <option value="IPv4 + IPv6" selected>
                                IPv4 + IPv6
                            </option>
                            <option value="IPv4">IPv4</option>
                            <option value="IPv6">IPv6</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label for="dateFilter">Date</label>
                        <select id="dateFilter">
                            <option value="" disabled selected>
                                Loading...
                            </option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label for="themeToggle">Theme</label>
                        <button
                            id="themeToggle"
                            class="theme-toggle-btn"
                            type="button"
                            aria-label="Toggle theme"
                            title="Toggle theme"
                        >
                            <svg
                                class="theme-icon sun-icon hidden"
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                                focusable="false"
                            >
                                <circle cx="12" cy="12" r="5"></circle>

                                <line x1="12" y1="1" x2="12" y2="3"></line>

                                <line x1="12" y1="21" x2="12" y2="23"></line>

                                <line
                                    x1="4.22"
                                    y1="4.22"
                                    x2="5.64"
                                    y2="5.64"
                                ></line>

                                <line
                                    x1="18.36"
                                    y1="18.36"
                                    x2="19.78"
                                    y2="19.78"
                                ></line>

                                <line x1="1" y1="12" x2="3" y2="12"></line>

                                <line x1="21" y1="12" x2="23" y2="12"></line>

                                <line
                                    x1="4.22"
                                    y1="19.78"
                                    x2="5.64"
                                    y2="18.36"
                                ></line>

                                <line
                                    x1="18.36"
                                    y1="5.64"
                                    x2="19.78"
                                    y2="4.22"
                                ></line>
                            </svg>

                            <svg
                                class="theme-icon moon-icon"
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                                focusable="false"
                            >
                                <path
                                    d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
                                ></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Status -->
            <div
                id="statusContainer"
                class="hidden"
                role="status"
                aria-live="polite"
            >
                <div
                    id="errorAlert"
                    class="status-msg status-msg-error hidden"
                    role="alert"
                >
                    Failed to load monitoring data.
                </div>

                <div id="emptyAlert" class="status-msg status-msg-empty hidden">
                    No data yet. Initializing background tasks...
                </div>

                <div
                    id="loadingSkeleton"
                    class="status-msg status-msg-loading hidden"
                >
                    Loading system metrics...
                </div>
            </div>

            <!-- Main Content -->
            <main id="mainContent">
                <!-- Current Metrics -->
                <section
                    id="latencyCardsContainer"
                    class="metrics-grid"
                    aria-label="Current network metrics"
                >
                    <!-- Latency cards are populated by JavaScript. -->

                    <!-- Speedtest card is repositioned by JavaScript. -->
                    <div id="speedtestCard" class="instrument-box hidden">
                        <div class="instrument-label">
                            <span>Speedtest.net</span>

                            <div
                                class="speed-indicators"
                                aria-label="Speedtest metrics"
                            >
                                <span class="indicator indicator-download">
                                    ↓ DL
                                </span>

                                <span class="indicator indicator-upload">
                                    ↑ UL
                                </span>
                            </div>
                        </div>

                        <div class="speed-values">
                            <span
                                id="latestDownload"
                                class="instrument-value speed-dl"
                            >
                                --
                            </span>

                            <span
                                class="instrument-value speed-slash"
                                aria-hidden="true"
                            >
                                /
                            </span>

                            <span
                                id="latestUpload"
                                class="instrument-value speed-ul"
                            >
                                --
                            </span>

                            <span class="instrument-unit"> Mbps </span>
                        </div>

                        <div id="speedtestTime" class="instrument-footer">
                            Current Speed
                        </div>
                    </div>
                </section>

                <!-- Historical Charts -->
                <section
                    class="charts-section"
                    aria-label="Historical network metrics"
                >
                    <!-- Latency Chart -->
                    <section
                        class="chart-container"
                        aria-label="Historical latency"
                    >
                        <div class="chart-controls">
                            <div class="control-group">
                                <label for="latencyTargetFilter">
                                    Address
                                </label>

                                <select
                                    id="latencyTargetFilter"
                                    aria-label="Latency target"
                                >
                                    <option value="__all__" selected>
                                        All
                                    </option>
                                </select>
                            </div>

                            <div
                                id="latencyTimeControlGroup"
                                class="control-group"
                            >
                                <label for="latencyTimeFilter"> Time </label>

                                <select
                                    id="latencyTimeFilter"
                                    aria-label="Latency time window"
                                >
                                    <option value="today" selected>
                                        Today
                                    </option>

                                    <option value="1h">Last 1 Hour</option>

                                    <option value="5h">Last 5 Hours</option>

                                    <option value="12h">Last 12 Hours</option>
                                </select>
                            </div>
                        </div>

                        <div class="chart-wrapper">
                            <canvas
                                id="latencyChart"
                                aria-label="Historical latency chart"
                                role="img"
                            ></canvas>
                        </div>

                        <div class="instrument-footer">Historical Latency</div>
                    </section>

                    <!-- Speedtest Chart -->
                    <section
                        id="speedtestChartSection"
                        class="chart-container hidden"
                        aria-label="Speedtest history"
                    >
                        <div class="chart-wrapper">
                            <canvas
                                id="speedtestChart"
                                aria-label="Historical speedtest chart"
                                role="img"
                            ></canvas>
                        </div>

                        <div class="instrument-footer">Speedtest</div>
                    </section>
                </section>
            </main>
        </div>
    </body>
</html>
